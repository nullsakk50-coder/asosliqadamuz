details{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px 22px;margin-bottom:10px}

.ct{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:56px 28px;text-align:center}

footer{padding:28px 0;color:var(--mut);font-size:14px;text-align:center;border-top:1px solid var(--line)}
@media(max-width:760px){nav{display:none}.stats{grid-template-columns:1fr}.hero{grid-template-columns:1fr;padding-top:48px}.hp{order:-1}.abg{grid-template-columns:1fr;gap:28px}section{padding:56px 0}}

var L={
ru:["Услуги","Работы","Обо мне","Вопросы","Контакты","Связаться","Студия AI видео и контента","Усиливаю голос вашего бренда с помощью искусственного интеллекта","Я Махсуджан — создаю для бизнеса рекламные видео, контент для соцсетей и презентационные ролики с помощью ИИ. От идеи до готового видео — быстро и качественно.","Оставить заявку","Смотреть работы","готовых видео-проектов","часов — средний срок выполнения","направления: реклама, контент, презентация, курс","От идеи до готового видео","Каждый проект адаптируется под тон вашего бренда. Цена зависит от длительности и сложности видео.","Фото","Обработка и создание фото с помощью AI","Видео — 10 секунд","Короткий ролик для сторис или reels","Видео — 30 секунд","Рекламный или контентный ролик среднего формата","Видео — 1 минута","Полноценный ролик для рекламы или презентации","Создание сайта","Одностраничный сайт под ваш бизнес, как этот","Курс по бизнесу","Обучение, как запустить и вести бизнес на AI-контенте","Галерея работ","Примеры последних проектов для разных сфер. Реальные видео-примеры можно посмотреть в моём Instagram.","Привет, я Махсуджан","Создаю видео и контент для бизнеса с помощью технологий искусственного интеллекта. Моя цель — найти уникальный голос для каждого бренда и донести его до клиентов через быстрое и качественное видео.","От рекламных роликов до контент-планов для соцсетей — мы вместе пройдём путь от идеи до готового результата. В каждом проекте я уделяю внимание точности, скорости и качеству.","Работали с ним — увидели результат","Видео было готово очень быстро, а качество превзошло ожидания. Клиентов стало больше.","Владелец кафе","Контент-план сработал чётко и организованно. Наш Instagram ожил.","Основательница онлайн-магазина","Видеосериал для моего курса сделан очень профессионально, число учеников выросло.","Онлайн-наставник","Часто задаваемые вопросы","Сколько времени занимает подготовка видео?","Обычно 24–48 часов, срок может меняться в зависимости от сложности проекта.","Насколько качественным получается видео, созданное с помощью AI?","Инструменты искусственного интеллекта используются вместе с профессиональным монтажом и дизайном — результат на уровне готовой рекламы.","Какие способы оплаты доступны?","Наличные, перевод на карту или оплата по этапам проекта — договоримся через Instagram.","У меня есть своя идея, вы её реализуете?","Конечно. Выслушаю вашу идею и превращу её в сценарий и видеоформат.","На каких языках вы готовите видео?","Видео и субтитры можно подготовить на узбекском, русском и английском языках.","Готовы начать свой проект?","Напишите в Instagram или TikTok — отвечу в течение 24 часов.","© 2026 Махсуджан — студия AI видео и контента","Махсуджан","тг","Реклама","Контент","Презентация","Курс","Азиз Рахимов","Нилуфар Каримова","Шерзод Юсупов"],
uz:["Xizmatlar","Ishlar","Men haqimda","Savollar","Aloqa","Bogʻlanish","AI video va kontent studiyasi","Brendingiz ovozini sunʼiy intellekt yordamida kuchaytiraman","Men Maxsujonman — biznes uchun reklama videolari, ijtimoiy tarmoqlar kontenti va taqdimot roliklarini AI yordamida yarataman. Gʻoyadan tayyor videogacha — tez va sifatli.","Ariza qoldirish","Ishlarni koʻrish","tayyor video-loyiha","soat — oʻrtacha bajarilish muddati","yoʻnalish: reklama, kontent, taqdimot, kurs","Gʻoyadan tayyor videogacha","Har bir loyiha brendingiz ohangiga moslashtiriladi. Narx videoning davomiyligi va murakkabligiga bogʻliq.","Foto","AI yordamida fotolarni qayta ishlash va yaratish","Video — 10 soniya","Storis yoki reels uchun qisqa rolik","Video — 30 soniya","Oʻrta formatdagi reklama yoki kontent rolik","Video — 1 daqiqa","Reklama yoki taqdimot uchun toʻliq rolik","Sayt yaratish","Biznesingiz uchun bir sahifali sayt — xuddi mana shunday","Biznes kursi","AI-kontent asosida biznesni qanday boshlash va yuritishni oʻrgatish","Ishlar galereyasi","Turli sohalar uchun bajarilgan soʻnggi loyihalar namunalari. Haqiqiy video namunalarni Instagramimda koʻrishingiz mumkin.","Salom, men Maxsujonman","Biznes uchun video va kontentni sunʼiy intellekt texnologiyalari yordamida yarataman. Maqsadim — har bir brend uchun betakror ovoz topish va uni tez hamda sifatli video orqali mijozlarga yetkazish.","Reklama roliklaridan tortib ijtimoiy tarmoqlar uchun kontent-rejagacha — gʻoyadan tayyor natijagacha birga yoʻl bosamiz. Har bir loyihada aniqlik, tezlik va sifatga eʼtibor beraman.","U bilan ishlashdi — natijani koʻrishdi","Video juda tez tayyor boʻldi, sifati kutganimdan ham yaxshi chiqdi. Mijozlar koʻpaydi.","Kafe egasi","Kontent-reja aniq va tartibli ishladi. Instagramimiz jonlandi.","Onlayn doʻkon asoschisi","Kursim uchun videoserial juda professional qilingan, oʻquvchilar soni oshdi.","Onlayn ustoz","Tez-tez beriladigan savollar","Videoni tayyorlash qancha vaqt oladi?","Odatda 24–48 soat, murakkablikka qarab muddat oʻzgarishi mumkin.","AI yordamida yaratilgan video qanchalik sifatli?","Sunʼiy intellekt vositalari professional montaj va dizayn bilan birga ishlatiladi — natija tayyor reklama darajasida.","Qanday toʻlov usullari bor?","Naqd pul, kartaga oʻtkazma yoki loyiha bosqichlari boʻyicha toʻlov — Instagram orqali kelishamiz.","Oʻz gʻoyam bor, uni amalga oshirasizmi?","Albatta. Gʻoyangizni eshitib, uni ssenariy va video formatga aylantiraman.","Videolarni qaysi tillarda tayyorlaysiz?","Video va subtitrlarni oʻzbek, rus va ingliz tillarida tayyorlash mumkin.","Loyihangizni boshlashga tayyormisiz?","Instagram yoki TikTok’da yozing — 24 soat ichida javob beraman.","© 2026 Maxsujon — AI video va kontent studiyasi","Maxsujon","tg","Reklama","Kontent","Taqdimot","Kurs","Aziz Rahimov","Nilufar Karimova","Sherzod Yusupov"],
kk:["Қызметтер","Жұмыстар","Мен туралы","Сұрақтар","Байланыс","Хабарласу","AI бейне және контент студиясы","Жасанды интеллект арқылы брендіңіздің дауысын күшейтемін","Мен Махсуджанмын — бизнеске арналған жарнамалық бейнелерді, әлеуметтік желіге контентті және презентациялық роликтерді ЖИ көмегімен жасаймын. Идеядан дайын бейнеге дейін — жылдам әрі сапалы.","Өтінім қалдыру","Жұмыстарды көру","дайын бейне-жоба","сағат — орташа орындау мерзімі","бағыт: жарнама, контент, презентация, курс","Идеядан дайын бейнеге дейін","Әр жоба брендіңіздің тонына бейімделеді. Баға бейненің ұзақтығы мен күрделілігіне байланысты.","Фото","AI көмегімен фотоны өңдеу және жасау","Бейне — 10 секунд","Сторис немесе reels үшін қысқа ролик","Бейне — 30 секунд","Орта форматтағы жарнамалық немесе контент ролигі","Бейне — 1 минут","Жарнама немесе презентацияға арналған толыққанды ролик","Сайт жасау","Бизнесіңізге арналған бір беттік сайт — дәл осындай","Бизнес курсы","AI-контент арқылы бизнесті қалай бастап, жүргізу керектігін үйрету","Жұмыстар галереясы","Әртүрлі салаларға орындалған соңғы жобалардан үлгілер. Нақты бейне үлгілерді менің Instagram-нан көре аласыз.","Сәлем, мен Махсуджанмын","Бизнеске арналған бейне мен контентті жасанды интеллект технологиялары арқылы жасаймын. Мақсатым — әр бренд үшін бірегей дауыс тауып, оны жылдам әрі сапалы бейне арқылы клиенттерге жеткізу.","Жарнамалық роликтерден әлеуметтік желіге арналған контент-жоспарға дейін — идеядан дайын нәтижеге дейін бірге жүреміз. Әр жобада дәлдікке, жылдамдыққа және сапаға көңіл бөлемін.","Онымен жұмыс істеді — нәтижесін көрді","Бейне өте тез дайын болды, сапасы күткенімнен де жоғары шықты. Клиенттер көбейді.","Кафе иесі","Контент-жоспар нақты әрі ұйымшыл жұмыс істеді. Instagram-ымыз жандана түсті.","Онлайн-дүкен негізін қалаушы","Курсыма арналған бейнесериал өте кәсіби жасалған, оқушылар саны өсті.","Онлайн-тәлімгер","Жиі қойылатын сұрақтар","Бейнені дайындауға қанша уақыт кетеді?","Әдетте 24–48 сағат, мерзім жобаның күрделілігіне қарай өзгеруі мүмкін.","AI арқылы жасалған бейненің сапасы қандай?","Жасанды интеллект құралдары кәсіби монтаж және дизайнмен бірге қолданылады — нәтиже дайын жарнама деңгейінде.","Қандай төлем тәсілдері бар?","Қолма-қол ақша, картаға аударым немесе жоба кезеңдері бойынша төлем — Instagram арқылы келісеміз.","Менің өз идеям бар, оны жүзеге асырасыз ба?","Әрине. Идеяңызды тыңдап, оны сценарий мен бейне форматына айналдырамын.","Бейнелерді қандай тілдерде дайындайсыз?","Бейне мен субтитрлерді өзбек, орыс және ағылшын тілдерінде дайындауға болады.","Жобаңызды бастауға дайынсыз ба?","Instagram немесе TikTok-қа жазыңыз — 24 сағат ішінде жауап беремін.","© 2026 Махсуджан — AI бейне және контент студиясы","Махсуджан","тг","Жарнама","Контент","Презентация","Курс","Азиз Рахимов","Нилуфар Каримова","Шерзод Юсупов"],

al editing and design — the result is at the level of finished advertising.","What payment methods are available?","Cash, card transfer or payment by project stage — we’ll agree via Instagram.","I have my own idea. Will you make it happen?","Of course. I’ll listen to your idea and turn it into a script and video format.","What languages do you make videos in?","Video and subtitles can be prepared in Uzbek, Russian and English.","Ready to start your project?","Message me on Instagram or TikTok — I’ll reply within 24 hours.","© 2026 Mahsujan — AI video & content studio","Mahsujan","tg","Ads","Content","Presentation","Course","Aziz Rakhimov","Nilufar Karimova","Sherzod Yusupov"]};
